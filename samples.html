<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weselle Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: sans-serif;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1.5rem;
      color: #ffffff;
    }
    .videos {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      max-width: 960px;
      margin: 0 auto;
    }
    .video-item label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #aaa;
    }
    video {
      width: 100%;
      border-radius: 8px;
      background: #000;
    }
  </style>
</head>
<body>
  <!--<h1>UNM-2027 Preview</h1>-->
  <div class="videos">
    <div class="video-item">
      <!--<label>UNM2027-2.mov</label>-->
      <video id="my-video" controls>

        <source id="video-source" src="https://ocorporeal.ut.ee/press/UNM-2027/UNM2027-4.mp4" type="video/mp4">
        Your browser does not support this video format.
      </video>
    </div>
  </div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    // 1. Get the query parameters from the current URL
    const urlParams = new URLSearchParams(window.location.search);
    const videoKey = urlParams.get('videoID'); // Looks for '?video=something'

    // 2. Define your video library map
    const videoMap = {
        '1': 'https://ocorporeal.ut.ee/press/UNM-2027/UNM2027-4.mp4', // Example clip 1
        '2': 'https://ocorporeal.ut.ee/press/UNM-2027/UNM2027-3.mov',    // Example clip 2
        '3': 'https://ocorporeal.ut.ee/press/UNM-2027/UNM2027-2.mov'
    };

    // 3. Grab the video and source elements
    const videoElement = document.getElementById('my-video');
    const sourceElement = document.getElementById('video-source');

    // 4. If the URL parameter matches a video in our map, change it
    if (videoKey && videoMap[videoKey]) {
        sourceElement.src = videoMap[videoKey];
        
        // Crucial: Tell the video element to reload the new source
        videoElement.load(); 
        
        // Optional: Auto-play the new video
        // videoElement.play().catch(err => console.log("Autoplay blocked by browser"));
    }
});

</script>
</body>
</html>
